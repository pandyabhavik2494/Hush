name: Hush for Android

on:
  push:
    branches: [android, development, main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        env:
          HUSH_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      # Signed with this machine's throwaway debug key; the copy Bhavik installs is re-signed with Hush's key.
      - name: Name the app file
        run: cp app/build/outputs/apk/release/app-release.apk Hush-ci.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/Hush-ci.apk

      - name: Publish the build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Hush for Android (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: "Build output for re-signing. Not for installing directly."
          files: android/Hush-ci.apk
          prerelease: true

  # On an Android emulator: tap a song in the real release APK and check it keeps playing, then run
  # the instrumented tests on a cover-screen-sized and an inner-screen-sized display.
  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/apk

      - name: Make test songs and a test video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          bash android/ci/make-test-media.sh "${{ runner.temp }}/media"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: bash ci/device-tests.sh "${{ runner.temp }}/media" "${{ runner.temp }}/apk/Hush-ci.apk" "${{ runner.temp }}/results"

      - name: Bundle the results
        if: always()
        run: cd "${{ runner.temp }}" && zip -qr test-results.zip results

      - name: Publish the results
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          files: ${{ runner.temp }}/test-results.zip
          prerelease: true

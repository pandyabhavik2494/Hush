name: Hush for Android

on:
  push:
    branches: [android, development, main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives in the HUSH_KEYSTORE_BASE64 / HUSH_KEYSTORE_PASSWORD secrets.
      - name: Get the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HUSH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hush.jks"
            echo "HUSH_KEYSTORE_PATH=$RUNNER_TEMP/hush.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the app
        env:
          HUSH_VERSION_CODE: ${{ github.run_number }}
          HUSH_KEYSTORE_PASSWORD: ${{ secrets.HUSH_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # Signed with this machine's throwaway debug key; the copy Bhavik installs is re-signed with Hush's key.
      - name: Name the app file
        run: cp app/build/outputs/apk/release/app-release.apk Hush-ci.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hush-${{ github.run_number }}
          path: android/Hush-ci.apk

      - name: Publish the build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Hush for Android (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: "Build output for re-signing. Not for installing directly."
          files: android/Hush-ci.apk
          prerelease: true
